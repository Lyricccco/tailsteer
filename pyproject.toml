[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tailsteer"
version = "0.1.0"
description = "Preservation-aware trajectory steering for consistent iterative image editing"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "numpy>=1.26", "Pillow>=10", "safetensors>=0.4", "huggingface-hub>=0.25", "tqdm>=4.66"]

[project.optional-dependencies]
evaluation = ["requests", "openai", "scikit-image", "lpips", "pandas", "pyarrow"]
test = ["pytest"]

[project.scripts]
tailsteer = "tailsteer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
