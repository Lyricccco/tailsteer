name: Project page

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/check_website.py'
      - '.github/workflows/pages.yml'
      - 'README.md'
      - 'THIRD_PARTY.md'
      - 'docs/model-cards/**'
  pull_request:
    paths:
      - 'website/**'
      - 'scripts/check_website.py'
      - '.github/workflows/pages.yml'
      - 'README.md'
      - 'THIRD_PARTY.md'
      - 'docs/model-cards/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate page and shared assets
        run: |
          python3 scripts/check_website.py
          for script in website/*.js; do node --check "$script"; done
      - name: Package the static site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
