model:
  name: flux1_kontext_dev
  path: ${TAILSTEER_MODEL_ROOT}/FLUX.1-Kontext-dev
  code_path: ${TAILSTEER_ROOT}/upstream/flux
  dtype: bfloat16
  guidance_scale: 2.5
  layer_checkpointing: true
  state_representation: flux1_unpacked_vae_latent
data:
  manifest: ${TAILSTEER_DATA_ROOT}/training/sources.jsonl
  image_root: ${TAILSTEER_DATA_ROOT}/training
  fields:
    source: source
    prompt: prompt
    seed: seed
cache:
  recipe: annotated-mixed
  completion_mode: candidates_exhausted
  storage_layout: trajectory_grouped_v2
  mask_variants:
  - fine
  - dilate5
  output_dir: ${TAILSTEER_CACHE_ROOT}/flux1-kontext-dev
  width: 1024
  height: 1024
  num_steps: 30
  forward_points:
  - 0
  - 3
  - 6
  - 9
  - 12
  - 15
  - 18
  - 21
  - 22
  - 23
  - 24
  - 25
  - 26
  - 27
  - 28
  - 29
  final_point: 30
  candidate_start: 0
  candidate_end: auto
  seed: 0
  noise_mode: pure_noise
  noop_prompt: Keep the image exactly unchanged.
  filter:
    enabled: true
    reference_mode: none
    component_policy: all
    min_noop_ssim: 0.82
    max_noop_rgb_mae: 0.065
    max_changed_ratio: 0.1
    change_threshold: 0.22
    min_ssim: 0.72
    min_raw_edit_ratio: 0.002
    max_raw_edit_ratio: 0.2
    min_component_dominance: 0.65
    max_bounding_box_ratio: 0.35
    min_patch_side: 32
    patch_multiple: 16
    dilation_pixels: 48
