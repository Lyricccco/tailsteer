seed: 42
model:
  name: sensenova_u1_5_8b_mot
  variant: sensenova-u1.5-8b-mot
  path: ${TAILSTEER_MODEL_ROOT}/SenseNova-U1.5-8B-MoT
  code_path: ${TAILSTEER_ROOT}/upstream/SenseNova-U1
  dtype: bfloat16
  cfg_scale: 4.0
  img_cfg_scale: 1.0
  cfg_norm: none
  timestep_shift: 3.0
  activation_offload: true
data:
  caches:
  - path: ${TAILSTEER_CACHE_ROOT}/sensenova-u1.5-8b-mot
    task: mixed
    tasks:
    - local_edit
    - noop
    mask_variant: dilate5
  split_seed: 42
  validation_fraction: 0.05
training:
  trainable:
    policy: full_model
    master_dtype: model
    conditioning_gradients: true
    reference_vision_model: false
    prefix_kv_adapter:
      enabled: false
      target: image_tokens
      last_n_layers: 8
      rank: 8
      scale: 1.0
  batch_size: 1
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-05
  weight_decay: 0.01
  max_grad_norm: 1.0
  max_epochs: null
  num_workers: 0
  validation_batches: 100
  checkpoint_io:
    cpu_offload: false
    writer_threads: 1
    per_thread_copy_ahead_bytes: 10000000
  gradient_checkpointing: false
  export_inference: true
  visual_validation:
    enabled: false
  steering_onset: 42
  last_denoising_step: 50
  blending_schedule: odds
  odds_ratio: 1.0
  timestep_sampling:
    strategy: sigma_beta
    rho: 0.8
    beta: 3.0
  preservation_endpoint: source_keep_terminal_edit
  max_updates: 2000
  warmup_updates: 100
  lr_decay_updates: 10000
  checkpoint_every_updates: 1000
  validate_every_updates: 1000
  log_every_updates: 10
distributed:
  mode: fsdp2
  fsdp2:
    param_dtype: bfloat16
    reduce_dtype: float32
    output_dtype: bfloat16
    cast_forward_inputs: false
    reshard_after_forward: true
run:
  output_dir: ${TAILSTEER_RUN_ROOT}/sensenova-u1.5-8b-mot
  resume: null
